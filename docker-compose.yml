services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: runs the Alembic migrations against Postgres and exits.
  # The gateway waits for this to finish successfully before starting,
  # so it never boots against an un-migrated database.
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
      # Reads from a .env file in the same directory as this compose file
      # (docker compose loads .env automatically for ${...} substitution).
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in a .env file next to docker-compose.yml}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
